            logBox.innerHTML = "⏳ Iniciando subida masiva a Firestore...<br>";

            let correctos = 0;

            for (let i = 0; i < listaInvitados.length; i++) {
                const item = listaInvitados[i];
                try {
                    // Subir el documento con los valores predeterminados de un modo Admin inicial

                        nombre: item.nombre,
                        mesa: item.mesa,
                        pasesAsignados: item.pasesAsignados,
                        pasesReales: 0, // Inicia en 0 hasta que confirmen asistencias reales
                        estado: "Pendiente" // Todos entran como Pendientes por defecto
                    });

                    logBox.innerHTML += `✅ (${correctos}/${listaInvitados.length}) Insertado: ${item.nombre}<br>`;

                } catch (error) {
                    console.error("Error con: " + item.nombre, error);
